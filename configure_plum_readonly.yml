---
# Plum is for discussion and for preparing prompts for Vibe in VS Code. It must never change code.
#
# 1. Plum's Vibe gets its own home (~/.vibe-plum) holding a chat-only agent, `lumiether-chat`, whose prompt
#    requires evidence for every claim and says what was not verified. VS Code's ~/.vibe is not touched.
# 2. The Plum bridge script (/usr/local/bin/vibe-acp-bridge) runs Vibe inside a read-only sandbox
#    (bubblewrap): the whole filesystem is read-only except ~/.vibe-plum, ~/.cache and /tmp.
#
# Imported by configure_plum_isolation.yml, so the AWX templates lumiether-plum-isolation-check / -apply run it.
# Idempotent. The previous bridge script is kept once as vibe-acp-bridge.bak-pre-readonly (rollback = copy it back).
- name: Plum read-only chat setup
  hosts: "{{ target | default('all') }}"
  become: true
  vars:
    plum_ro_users: [abhi, anish, node-1]
    # developers whose git repositories (top level of their home) appear read-only in their own Plum workspace
    plum_repo_users: [abhi, anish, arun]
    plum_model_name: mistral-large-2512
    plum_model_alias: mistral-large
    bridge_cmd: /usr/local/bin/vibe-acp-bridge
    bwrap_bin: /usr/bin/bwrap
    chat_src: "{{ playbook_dir }}/docker/vibe-cbm/lumiether/chat"
    base_prompt_src: "{{ playbook_dir }}/docker/vibe-cbm/lumiether/prompts/lumiether-codebase-first.md"
  tasks:
    - name: bubblewrap is installed
      ansible.builtin.stat:
        path: "{{ bwrap_bin }}"
      register: bwrap_stat
      failed_when: not bwrap_stat.stat.exists

    - name: Directory for the LUMIANS vision tool
      ansible.builtin.file:
        path: /opt/lumiether
        state: directory
        mode: "0755"

    # Lets Plum's Vibe read an attached image: it asks the vision model and returns text. It can only read the
    # user's own .claude-webui-attachments folder.
    - name: LUMIANS vision tool
      ansible.builtin.copy:
        src: "{{ chat_src }}/lumians-vision.py"
        dest: /opt/lumiether/lumians-vision.py
        owner: root
        group: root
        mode: "0755"

    - name: Set up each user's Plum home (before the bridge is switched over)
      ansible.builtin.include_tasks: tasks/plum_readonly_user.yml
      loop: "{{ plum_ro_users }}"
      loop_control:
        loop_var: pr

    - name: Keep the current bridge script once
      ansible.builtin.copy:
        src: "{{ bridge_cmd }}"
        dest: "{{ bridge_cmd }}.bak-pre-readonly"
        remote_src: true
        force: false
        mode: preserve

    - name: Install the read-only sandboxed bridge script
      ansible.builtin.copy:
        src: "{{ chat_src }}/vibe-acp-bridge"
        dest: "{{ bridge_cmd }}"
        owner: root
        group: root
        mode: "0755"

    - name: Script that exposes each developer's git repositories read-only in his Plum workspace
      ansible.builtin.copy:
        src: "{{ chat_src }}/lumiether-expose-repos.sh"
        dest: /usr/local/sbin/lumiether-expose-repos
        owner: root
        group: root
        mode: "0755"

    - name: systemd service for it
      ansible.builtin.copy:
        dest: /etc/systemd/system/lumiether-expose-repos.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by lumi-playbooks (configure_plum_readonly.yml)
          [Unit]
          Description=Expose developers' git repositories read-only in their Plum workspace
          After=local-fs.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/lumiether-expose-repos {{ plum_repo_users | join(' ') }}

    - name: systemd timer for it (30 s after boot, then every minute, so a new clone appears within a minute)
      ansible.builtin.copy:
        dest: /etc/systemd/system/lumiether-expose-repos.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by lumi-playbooks (configure_plum_readonly.yml)
          [Unit]
          Description=Expose developers' git repositories every minute

          [Timer]
          OnBootSec=30
          OnUnitActiveSec=60
          AccuracySec=5

          [Install]
          WantedBy=timers.target
      register: expose_timer

    - name: Enable the timer and run it once now
      ansible.builtin.systemd:
        name: lumiether-expose-repos.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Run the script once now
      ansible.builtin.command: /usr/local/sbin/lumiether-expose-repos {{ plum_repo_users | join(' ') }}
      changed_when: false
      when: not ansible_check_mode

    - name: Summary
      ansible.builtin.debug:
        msg: "{{ plum_ro_report | default([]) }}"
