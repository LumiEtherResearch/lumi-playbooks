---
- name: Install Flutter (includes Dart) for all developers
  hosts: all
  become: true
  vars:
    flutter_ref: stable          # pin to an exact tag once installed, e.g. 3.xx.x
    flutter_dir: /opt/flutter
    android_home: /opt/android-sdk
    java_major: 21
    flutter_users: [abhi, anish, arun, node-1]
  tasks:
    - name: System packages Flutter needs
      ansible.builtin.apt:
        name: [git, curl, unzip, xz-utils, zip, libglu1-mesa]
        state: present
        update_cache: true

    - name: Shared group for Flutter users
      ansible.builtin.group:
        name: flutter
        state: present

    - name: Add developers to the group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: flutter
        append: true
      loop: "{{ flutter_users }}"

    - name: Clone Flutter
      ansible.builtin.git:
        repo: https://github.com/flutter/flutter.git
        dest: "{{ flutter_dir }}"
        version: "{{ flutter_ref }}"
        depth: 1
        force: false

    - name: Allow every user to use the shared checkout
      ansible.builtin.shell: |
        git config --system --get-all safe.directory | grep -qx "{{ flutter_dir }}" || {
          git config --system --add safe.directory "{{ flutter_dir }}"; echo ADDED; }
      register: safe_dir
      changed_when: "'ADDED' in safe_dir.stdout"

    - name: Download the Dart SDK and web tooling once (as root, perms fixed below)
      ansible.builtin.command: "{{ flutter_dir }}/bin/flutter precache --web"
      environment: { HOME: /root }
      changed_when: false

    - name: Group-writable so the SDK can update its cache
      ansible.builtin.file:
        path: "{{ flutter_dir }}"
        owner: root
        group: flutter
        mode: "g+rwX"
        recurse: true

    - name: Set setgid on directories
      ansible.builtin.command: find {{ flutter_dir }} -type d -exec chmod g+s {} +
      changed_when: false

    - name: Put flutter and dart on PATH for login shells
      ansible.builtin.copy:
        dest: /etc/profile.d/flutter.sh
        mode: "0644"
        content: |
          export PATH="$PATH:{{ flutter_dir }}/bin"
          export FLUTTER_SUPPRESS_ANALYTICS=true
          export DART_SUPPRESS_ANALYTICS=true

    - name: Wrappers so every flutter/dart run creates group-writable files
      ansible.builtin.copy:
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        content: |
          #!/bin/sh
          umask 002
          export JAVA_HOME="${JAVA_HOME:-$(ls -d /usr/lib/jvm/java-{{ java_major }}-openjdk-* 2>/dev/null | head -1)}"
          export ANDROID_HOME="{{ android_home }}"
          export ANDROID_SDK_ROOT="{{ android_home }}"
          exec {{ flutter_dir }}/bin/{{ item }} "$@"
      loop: [flutter, dart]
