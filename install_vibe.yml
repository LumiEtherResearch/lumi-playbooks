---
- name: Install Mistral Vibe (shared CLI installation)
  hosts: all
  become: true
  vars:
    vibe_install_dir: /opt/mistral-vibe
    uv_python_install_dir: /opt/uv-python
    uv_bin: /usr/local/bin/uv
    # Pinned to what node-2 runs and what the vibe-cbm image installs (docker/vibe-cbm/Dockerfile VIBE_VERSION). To bump: change both,
    # and VERIFY_EXPECT_VIBE in infra-bootstrap's verify.sh.
    vibe_pinned: "2.25.8"
    # uv gives up on a download after UV_HTTP_TIMEOUT seconds (default 30). The mistral-vibe wheel is 54 MiB and the first download of a file the CDN does
    # not have yet, or one over a NAT'd link (the test VM), can take longer: install-vibe failed that way on a new server (uv: "network timeout").
    uv_http_timeout: "600"

  tasks:
    - name: Ensure python3 and venv support are installed
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
        state: present
        update_cache: true

    - name: Check if uv is already installed
      ansible.builtin.stat:
        path: "{{ uv_bin }}"
      register: uv_check

    - name: Install uv (Python package manager used to install Vibe)
      ansible.builtin.shell: |
        curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
      args:
        executable: /bin/bash
      when: not uv_check.stat.exists

    - name: Ensure shared uv python install dir exists and is world-readable
      ansible.builtin.file:
        path: "{{ uv_python_install_dir }}"
        state: directory
        mode: "0755"

    - name: Create shared venv for Vibe
      ansible.builtin.command:
        cmd: "{{ uv_bin }} venv {{ vibe_install_dir }} --python 3.12"
        creates: "{{ vibe_install_dir }}/bin/python"
      environment:
        UV_PYTHON_INSTALL_DIR: "{{ uv_python_install_dir }}"
        UV_HTTP_TIMEOUT: "{{ uv_http_timeout }}"

    - name: Which mistral-vibe is installed in the shared venv? (empty = none)
      ansible.builtin.shell: >-
        {{ uv_bin }} pip show --python {{ vibe_install_dir }}/bin/python mistral-vibe 2>/dev/null | sed -n 's/^Version: //p'
      register: vibe_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install mistral-vibe into the shared venv (pinned to {{ vibe_pinned }}; skipped when that version is already there)
      ansible.builtin.command:
        cmd: "{{ uv_bin }} pip install --python {{ vibe_install_dir }}/bin/python mistral-vibe=={{ vibe_pinned }}"
      environment:
        UV_HTTP_TIMEOUT: "{{ uv_http_timeout }}"
      when: (vibe_installed.stdout | trim) != vibe_pinned

    - name: Symlink vibe onto PATH for all users
      ansible.builtin.file:
        src: "{{ vibe_install_dir }}/bin/vibe"
        dest: /usr/local/bin/vibe
        state: link
        force: true

    - name: Verify installation
      ansible.builtin.command:
        cmd: vibe --version
      register: vibe_version
      changed_when: false
      failed_when: not ansible_check_mode and vibe_pinned not in vibe_version.stdout

    - name: Show installed version
      ansible.builtin.debug:
        msg: "Installed: {{ vibe_version.stdout }}"
