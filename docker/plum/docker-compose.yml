services:
  postgres:
    image: postgres:17-alpine
    container_name: plum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plumcode
      POSTGRES_USER: plumcode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - plum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumcode -d plumcode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plum

  plum:
    image: valentin2177/plum-code-webui:latest
    container_name: plum
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEBUI_BIND:-127.0.0.1}:${PLUM_PORT:-4545}:3001"
    shm_size: 1gb
    environment:
      NODE_ENV: production
      TZ: Asia/Kolkata
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: plumcode
      PGUSER: plumcode
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:?set AUTH_ALLOWED_EMAILS}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      ALLOWED_BASE_PATHS: /workspace
      CODEX_WEBUI_SANDBOX_MODE: workspace-write
      CODEX_WEBUI_APPROVAL_POLICY: on-request
      CLI_RUNNER_ACCESS: admin-only
      CLI_AUTO_UPDATE: "false"
    volumes:
      - plum-data:/app/packages/backend/data
      - plum-workspace:/workspace
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - plum

volumes:
  plum-postgres-data:
  plum-data:
  plum-workspace:

networks:
  plum:
    driver: bridge
