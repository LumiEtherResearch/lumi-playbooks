---
# Included once per user (loop variable: pr).
- name: "{{ pr }}: look up home directory"
  ansible.builtin.getent:
    database: passwd
    key: "{{ pr }}"
  failed_when: false

- name: "{{ pr }}: skip unknown user"
  ansible.builtin.set_fact:
    plum_ro_report: "{{ plum_ro_report | default([]) + [pr ~ ': SKIPPED (no such user)'] }}"
  when: getent_passwd[pr] is not defined

- name: "{{ pr }}: apply"
  when: getent_passwd[pr] is defined
  vars:
    pr_home: "{{ getent_passwd[pr][4] }}"
  block:
    - name: "{{ pr }}: the sandbox starts for this user and makes a project read-only"
      ansible.builtin.command: >-
        {{ bwrap_bin }} --ro-bind / / --dev /dev --proc /proc
        sh -c 'touch "$1" 2>/dev/null && exit 1 || exit 0' sh {{ pr_home }}/.plum-ro-probe
      become_user: "{{ pr }}"
      changed_when: false
      check_mode: false

    - name: "{{ pr }}: the normal Vibe config exists (run lumiether-vibe-apply first if not)"
      ansible.builtin.stat:
        path: "{{ pr_home }}/.vibe/config.toml"
      register: pr_cfg
      failed_when: not pr_cfg.stat.exists

    - name: "{{ pr }}: Plum home directories"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ pr }}"
        group: "{{ pr }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ pr_home }}/.vibe-plum", mode: "0700" }
        - { path: "{{ pr_home }}/.vibe-plum/agents", mode: "0755" }
        - { path: "{{ pr_home }}/.vibe-plum/prompts", mode: "0755" }
        - { path: "{{ pr_home }}/.cache", mode: "0700" }
      loop_control:
        label: "{{ item.path }}"

    - name: "{{ pr }}: chat agent"
      ansible.builtin.copy:
        src: "{{ chat_src }}/agents/lumiether-chat.toml"
        dest: "{{ pr_home }}/.vibe-plum/agents/lumiether-chat.toml"
        owner: "{{ pr }}"
        group: "{{ pr }}"
        mode: "0600"

    # The chat prompt = the chat rules + the normal LumiEther codebase prompt, so prompt fixes reach Plum too.
    - name: "{{ pr }}: chat prompt (rules, then the codebase prompt)"
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', chat_src ~ '/prompts/lumiether-chat-header.md', rstrip=False) }}{{ lookup('ansible.builtin.file', base_prompt_src, rstrip=False) }}"
        dest: "{{ pr_home }}/.vibe-plum/prompts/lumiether-chat.md"
        owner: "{{ pr }}"
        group: "{{ pr }}"
        mode: "0600"

    - name: "{{ pr }}: Plum config, seeded once from the normal Vibe config (provider, model, MCP)"
      ansible.builtin.copy:
        src: "{{ pr_home }}/.vibe/config.toml"
        dest: "{{ pr_home }}/.vibe-plum/config.toml"
        remote_src: true
        force: false
        owner: "{{ pr }}"
        group: "{{ pr }}"
        mode: "0600"
      when: not ansible_check_mode

    - name: "{{ pr }}: Plum starts in the chat agent"
      ansible.builtin.lineinfile:
        path: "{{ pr_home }}/.vibe-plum/config.toml"
        regexp: '^default_agent\s*='
        line: 'default_agent = "lumiether-chat"'
        insertbefore: BOF
      when: not ansible_check_mode

    - name: "{{ pr }}: exactly one default_agent, and it is the chat agent"
      ansible.builtin.shell: >-
        test "$(grep -c '^default_agent' {{ pr_home }}/.vibe-plum/config.toml)" = 1 &&
        grep -q '^default_agent = "lumiether-chat"$' {{ pr_home }}/.vibe-plum/config.toml
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    # Plum answers questions about code, so it uses the larger model. VS Code Vibe (~/.vibe) is not touched.
    # Plum's config is a copy of the user's normal config. On node-2 that has a provider and a models list (added by hand), and the Plum
    # model is inserted into that inline list. On a new server nothing creates them (merge-config.py manages only default_agent and the
    # mcp_servers blocks), so Plum's config gets its own provider and models in a marked block. Anything else is not guessed at.
    - name: "{{ pr }}: Plum config models state (none = a new server, inline = like node-2, managed = this play's block)"
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import re, sys, tomllib
            text = open(sys.argv[1], encoding="utf-8").read()
            c = tomllib.loads(text)
            provs = c.get("providers", [])
            has_p = isinstance(provs, list) and any(p.get("name") == sys.argv[2] for p in provs)
            if "# BEGIN PLUM PROVIDER AND MODELS" in text: print("managed")
            elif "providers" not in c and "models" not in c: print("none")
            elif has_p and c.get("models") and re.search(r"(?m)^models = \[", text): print("inline")
            else: print("other")
          - "{{ pr_home }}/.vibe-plum/config.toml"
          - "{{ plum_provider_name }}"
      register: pr_models
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: "{{ pr }}: Plum config models are in a form this play does not extend"
      ansible.builtin.fail:
        msg: >-
          {{ pr_home }}/.vibe-plum/config.toml (seeded from {{ pr_home }}/.vibe/config.toml) has providers and/or models, but not a
          provider named {{ plum_provider_name }} together with an inline `models = [` list, and none of them from this play. Add the provider
          and the models to ~/.vibe/config.toml (or fix the Plum copy) so that both exist; nothing was changed.
      when: not ansible_check_mode and (pr_models.stdout | trim) == 'other'

    - name: "{{ pr }}: Plum provider and models for a new server (the normal Vibe config has none)"
      ansible.builtin.blockinfile:
        path: "{{ pr_home }}/.vibe-plum/config.toml"
        marker: "# {mark} PLUM PROVIDER AND MODELS"
        insertafter: EOF
        block: |
          [[providers]]
          name = "{{ plum_provider_name }}"
          api_base = "{{ plum_provider_api_base }}"
          backend = "generic"

          [[models]]
          name = "{{ plum_base_model_name }}"
          provider = "{{ plum_provider_name }}"
          alias = "{{ plum_base_model_alias }}"

          [[models]]
          name = "{{ plum_model_name }}"
          provider = "{{ plum_provider_name }}"
          alias = "{{ plum_model_alias }}"
      when: not ansible_check_mode and (pr_models.stdout | trim) in ['none', 'managed']

    - name: "{{ pr }}: Plum model {{ plum_model_alias }} is defined"
      ansible.builtin.lineinfile:
        path: "{{ pr_home }}/.vibe-plum/config.toml"
        regexp: '^\s*\{ name = "{{ plum_model_name }}"'
        insertafter: '^models = \['
        line: '    { name = "{{ plum_model_name }}", provider = "{{ plum_provider_name }}", alias = "{{ plum_model_alias }}" },'
      when: not ansible_check_mode and (pr_models.stdout | trim) == 'inline'

    - name: "{{ pr }}: Plum uses {{ plum_model_alias }}"
      ansible.builtin.lineinfile:
        path: "{{ pr_home }}/.vibe-plum/config.toml"
        regexp: '^active_model\s*='
        line: 'active_model = "{{ plum_model_alias }}"'
        insertbefore: BOF
      when: not ansible_check_mode

    - name: "{{ pr }}: exactly one active_model, and it is the Plum model"
      ansible.builtin.shell: >-
        test "$(grep -c '^active_model' {{ pr_home }}/.vibe-plum/config.toml)" = 1 &&
        grep -q '^active_model = "{{ plum_model_alias }}"$' {{ pr_home }}/.vibe-plum/config.toml
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: "{{ pr }}: Plum config verified: provider {{ plum_provider_name }} and model {{ plum_model_alias }}"
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "import sys,tomllib; c=tomllib.load(open(sys.argv[1],'rb')); ok=any(p.get('name')==sys.argv[2] for p in c.get('providers',[])) and any(m.get('alias')==sys.argv[3] and m.get('provider')==sys.argv[2] for m in c.get('models',[])); sys.exit(0 if ok else 1)"
          - "{{ pr_home }}/.vibe-plum/config.toml"
          - "{{ plum_provider_name }}"
          - "{{ plum_model_alias }}"
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: "{{ pr }}: drop an unmarked lumians-vision entry (Vibe can rewrite the file and lose the markers)"
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/scripts/drop_unmarked_vision.py {{ pr_home }}/.vibe-plum/config.toml"
        executable: /usr/bin/python3
      register: pr_dropvision
      changed_when: "'changed' in pr_dropvision.stdout"
      when: not ansible_check_mode

    - name: "{{ pr }}: the vision tool is an MCP server of Plum's Vibe"
      ansible.builtin.blockinfile:
        path: "{{ pr_home }}/.vibe-plum/config.toml"
        marker: "# {mark} LUMIANS VISION"
        insertafter: EOF
        block: |
          [[mcp_servers]]
          name = "lumians-vision"
          transport = "stdio"
          command = "/usr/bin/python3"
          args = ["/opt/lumiether/lumians-vision.py"]
      when: not ansible_check_mode

    - name: "{{ pr }}: Plum config is valid TOML and lists lumians-vision once (and codebase-memory-mcp)"
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "import sys,tomllib; c=tomllib.load(open(sys.argv[1],'rb')); n=[s['name'] for s in c.get('mcp_servers',[])]; sys.exit(0 if n.count('lumians-vision')==1 and 'codebase-memory-mcp' in n else 1)"
          - "{{ pr_home }}/.vibe-plum/config.toml"
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: "{{ pr }}: record result"
      ansible.builtin.set_fact:
        plum_ro_report: "{{ plum_ro_report | default([]) + [pr ~ ': Plum home ~/.vibe-plum ready, agent lumiether-chat, model ' ~ plum_model_alias ~ ', sandbox checked'] }}"
