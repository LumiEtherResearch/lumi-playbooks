---
# Give the host Mistral Vibe (VS Code extension and Plum) the LumiEther setup:
# Codebase Memory as an MCP server, ast-grep, the `lumiether` agent and its prompt.
#
#   ansible-playbook configure_vibe_lumiether.yml --check     # dry run
#   ansible-playbook configure_vibe_lumiether.yml
#
# Non-destructive: each user's config.toml is backed up once (config.toml.bak-lumiether),
# only two marked blocks are added, and a user who already configures the same keys is
# skipped and reported. Running sessions are not touched; new sessions pick it up.
- name: LumiEther Vibe setup (Codebase Memory, ast-grep, lumiether agent)
  hosts: "{{ target | default('all') }}"
  become: true
  vars:
    lumiether_users: [abhi, anish, arun, node-1]
    vibe_venv: /opt/mistral-vibe
    astgrep_version: "0.45.3"
    install_cbm: true          # false = skip the Codebase Memory installer
    configure_cbm: true        # false = skip `codebase-memory-mcp config set`
    cbm_bin: /usr/local/bin/codebase-memory-mcp
    # Pinned to what node-2 runs and what the vibe-cbm image installs (docker/vibe-cbm/Dockerfile CBM_VERSION, CBM_INSTALLER_SHA256). The
    # installer has no version option: it takes the release from CBM_DOWNLOAD_URL (default: the LATEST release) and checks the archive against that
    # release's checksums.txt. So the installer script is fetched from the version's TAG (sha256 checked here) and CBM_DOWNLOAD_URL points at the
    # same release. To bump: change cbm_version and cbm_installer_sha256 (sha256sum of that tag's install.sh), the Dockerfile ARGs, and
    # VERIFY_EXPECT_CBM in infra-bootstrap's verify.sh.
    cbm_version: "0.11.0"
    cbm_installer_sha256: "13049c7cc51bc508d68b8ecb8a9fd9574ecb7c6f2c9dd5a19bf7d4c187321145"
    cbm_installer_url: "https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/v{{ cbm_version }}/install.sh"
    cbm_download_url: "https://github.com/DeusData/codebase-memory-mcp/releases/download/v{{ cbm_version }}"
    cbm_installer_home: /root
    lumiether_src: "{{ playbook_dir }}/docker/vibe-cbm/lumiether"
    lumiether_lib: /opt/lumiether
  tasks:
    - name: Vibe venv must exist
      ansible.builtin.stat:
        path: "{{ vibe_venv }}/bin/python"
      register: vibe_py
      failed_when: not vibe_py.stat.exists

    - name: git must be installed (Codebase Memory's watcher and detect_changes need it)
      ansible.builtin.command: git --version
      changed_when: false

    - name: Find uv
      ansible.builtin.shell: command -v uv
      register: uv_path
      changed_when: false
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin:/root/.local/bin"

    - name: Install ast-grep into the Vibe venv (pinned)
      ansible.builtin.command: >-
        {{ uv_path.stdout }} pip install --python {{ vibe_venv }}/bin/python
        ast-grep-cli=={{ astgrep_version }}
      args:
        creates: "{{ vibe_venv }}/bin/ast-grep"

    # No `sg` link on purpose: it would shadow /usr/bin/sg from the shadow package.
    - name: Put ast-grep on PATH
      ansible.builtin.file:
        src: "{{ vibe_venv }}/bin/ast-grep"
        dest: /usr/local/bin/ast-grep
        state: link
      when: not ansible_check_mode

    - name: Which Codebase Memory is installed? (rc != 0 = none)
      ansible.builtin.command: "{{ cbm_bin }} --version"
      register: cbm_installed
      changed_when: false
      failed_when: false
      check_mode: false
      when: install_cbm | bool

    - name: Install Codebase Memory {{ cbm_version }} system-wide (official installer from the tag; skipped when that version is already there)
      when: install_cbm | bool and (cbm_installed.rc != 0 or cbm_version not in cbm_installed.stdout)
      block:
        - name: Temporary file for the installer
          ansible.builtin.tempfile:
            state: file
            suffix: -cbm-install.sh
          register: cbm_tmp

        - name: Fetch the installer of the pinned tag (sha256 checked)
          ansible.builtin.get_url:
            url: "{{ cbm_installer_url }}"
            dest: "{{ cbm_tmp.path }}"
            checksum: "sha256:{{ cbm_installer_sha256 }}"
            mode: "0700"
            force: true

        - name: Run the installer (it downloads and verifies the pinned release)
          ansible.builtin.command: "bash {{ cbm_tmp.path }} --dir={{ cbm_bin | dirname }}"
          environment:
            HOME: "{{ cbm_installer_home }}"
            CBM_DOWNLOAD_URL: "{{ cbm_download_url }}"

        - name: The installed Codebase Memory is the pinned version
          ansible.builtin.command: "{{ cbm_bin }} --version"
          register: cbm_after
          changed_when: false
          failed_when: cbm_version not in cbm_after.stdout
      always:
        - name: Remove the installer
          ansible.builtin.file:
            path: "{{ cbm_tmp.path }}"
            state: absent
          when: cbm_tmp.path is defined

    - name: Shared helper directory
      ansible.builtin.file:
        path: "{{ lumiether_lib }}"
        state: directory
        mode: "0755"

    - name: Config merger (readable by every user)
      ansible.builtin.copy:
        src: "{{ lumiether_src }}/merge-config.py"
        dest: "{{ lumiether_lib }}/merge-config.py"
        mode: "0755"

    - name: Preview helper (serves a folder on localhost only)
      ansible.builtin.copy:
        src: "{{ lumiether_src }}/lumi-preview"
        dest: /usr/local/bin/lumi-preview
        mode: "0755"

    - name: Per-user setup
      ansible.builtin.include_tasks: tasks/lumiether_user.yml
      loop: "{{ lumiether_users }}"
      loop_control:
        loop_var: lu

    - name: Summary
      ansible.builtin.debug:
        msg: "{{ lumiether_report | default([]) }}"
